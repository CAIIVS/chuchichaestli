# Build and publish the 📖 package documentation to GitHub Pages
# For more information see:
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site

name: Deploy docs 📖

on:
  workflow_call:
    inputs:
      strict:
        description: "Strict mode. This will cause MkDocs to abort the build on any warnings."
        type: boolean
        default: false
        required: false
  workflow_dispatch:
    inputs:
      strict:
        description: "Strict mode. This will cause MkDocs to abort the build on any warnings."
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and 🐍 3.13
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Newest supported interpreter. The rendered site does not depend on
          # it; this only needs to be a version the package imports under.
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Build 📖
        run: |
          uv run --locked --group docs mkdocs build ${{ inputs.strict && '--strict' || '' }}

      - name: Configure 📄
        uses: actions/configure-pages@v6

      - name: 🗃️ docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: 🛸 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
