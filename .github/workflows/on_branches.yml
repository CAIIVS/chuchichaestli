# Workflow that triggers when commits are pushed to a non-default branch, but aren't in a PR

name: Branch workflow

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["**/__about__.py"]

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.isInPR.outputs.result }}
    steps:
      # Skip this workflow when the commit is already covered by on_pr.yml.
      - name: Check if commit is in an open PR
        id: isInPR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                --jq '[.[] | select(.state == "open")] | length')
          [ "$n" -gt 0 ] && r=true || r=false
          echo "result=$r" >> "$GITHUB_OUTPUT"
          echo "open PRs containing this commit: $n (result=$r)"

  test-install-python-version:
    name: Test install on 🐍
    needs: in-pr-check
    if: ${{ needs.in-pr-check.outputs.result == 'false' }}
    uses: ./.github/workflows/test-install.yml
    with:
      lint: true
      pytest: true
      artifact-name: "pytest-results"

  build-package:
    name: Build distribution 📦
    needs: test-install-python-version
    uses: ./.github/workflows/build-package.yml
    with:
      artifact-name: "package-dist"
