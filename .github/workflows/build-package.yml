# Build the 🐍 Python package 📦 for distribution
# For more information see:
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Build distribution 📦

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Artifact base name of the distribution package"
        type: string
        default: "package-dist"
        required: false
      versions:
        description: >-
          Python versions to build on, as a JSON array. For ABI-specific builds,
          list every version that needs a wheel.
        type: string
        default: '["3.13"]'
        required: false

jobs:
  build-package:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.versions) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and 🐍 ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Build 🐍📦
        run: uv build

      # One artifact per version.
      - name: 🗃️ build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.python-version }}
          path: dist/
