[project]
name = "chuchichaestli"
dynamic = ["version"]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Philipp Denzel", email = "denp@zhaw.ch" },
    { name = "Marc Stadelmann", email = "stmd@zhaw.ch" },
    { name = "Daniel Barco", email = "baoc@zhaw.ch" },
    { name = "Yann Billeter", email = "bily@zhaw.ch" },
    { name = "Martin Oswald", email = "oswd@zhaw.ch" },
]
maintainers = [
    { name = "Philipp Denzel", email = "denp@zhaw.ch" },
    { name = "Marc Stadelmann", email = "stmd@zhaw.ch" },
    { name = "Daniel Barco", email = "baoc@zhaw.ch" },
]
description = "Where you find all the state-of-the-art cooking utensils (salt, pepper, gradient descent... the usual)."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["artificial intelligence", "deep learning", "neural networks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.2.2",
    "torchvision>=0.20.1",
    "h5py>=3.12.1",
    "safetensors[torch]>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
    "pytest>=8.3.4",
    "pytest-cov>=6.2.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-api-autonav>=0.3.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.0",
]
viz = [
    "matplotlib>=3.7",
]
all = [
    "ruff==0.16.4",
    "pre-commit>=3.7.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.2.1",
    "mkdocs>=1.6.1",
    "mkdocs-api-autonav>=0.3.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.0",
    "torch>=2.2.2",
    "matplotlib>=3.7",
]

[dependency-groups]
# CI installs `cpu` so it does not pull ~700 MB of unused CUDA libraries.
# `gpu` exists to give `cpu` something to conflict with, which is what makes uv
# fork the resolution; without it the CPU index would leak into the default one.
# Plain `uv sync` (no group) keeps resolving torch from PyPI, i.e. whatever
# suits the developer's hardware.
cpu = [
    "torch>=2.2.2",
    "torchvision>=0.20.1",
]
gpu = [
    "torch>=2.2.2",
    "torchvision>=0.20.1",
]
dev = [
    "ruff==0.16.4",
    "pre-commit>=3.7.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.2.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-api-autonav>=0.3.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.0",
]
viz = [
    "matplotlib>=3.7",
]

[tool.uv]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }]
torchvision = [{ index = "pytorch-cpu", group = "cpu" }]

[project.urls]
Documentation = "https://github.com/CAIIVS/chuchichaestli#readme"
Homepage = "https://github.com/CAIIVS/chuchichaestli"
Repository = "https://github.com/CAIIVS/chuchichaestli.git"
Issues = "https://github.com/CAIIVS/chuchichaestli/issues"
Source = "https://github.com/CAIIVS/chuchichaestli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chuchichaestli/__about__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/docs",
    "/.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chuchichaestli"]

[tool.hatch.envs.test]
dependencies = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

# Testing & coverage
[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["chuchichaestli"]
omit = [
    "*/chuchichaestli/__about__.py",
]

[tool.coverage.paths]
chuchichaestli = ["src/chuchichaestli"]
# tests = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Linting, flaking, etc.
[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "UP", # pyupgrade
    "D",  # pydocstyle
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["E402", "F811"]

[tool.ruff.lint.pydocstyle]
convention = "google"
